  const ITERATIONS = 250000;

  function b64ToBuf(b64) {
    const bin = atob(b64);
    const buf = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
    return buf;
  }

  async function tryDecrypt() {
    const pw = document.getElementById('pw').value;
    const errEl = document.getElementById('err');
    errEl.textContent = '';
    try {
      const enc = new TextEncoder();
      const salt = b64ToBuf(SALT_B64);
      const iv = b64ToBuf(IV_B64);
      const ct = b64ToBuf(CT_B64);
      const baseKey = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
      const key = await crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt, iterations: ITERATIONS, hash: 'SHA-256' },
        baseKey, { name: 'AES-GCM', length: 256 }, false, ['decrypt']
      );
      const plainBuf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ct);
      const html = new TextDecoder().decode(plainBuf);
      const frame = document.getElementById('content');
      frame.srcdoc = html;
      frame.style.display = 'block';
      document.getElementById('gate').style.display = 'none';
    } catch (e) {
      errEl.textContent = 'Contraseña incorrecta.';
    }
  }

  document.getElementById('pw').addEventListener('keydown', function(e){
    if (e.key === 'Enter') tryDecrypt();
  });
</script>
</body>
</html>
